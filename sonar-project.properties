# Front + API en el mismo repositorio (un solo proyecto de SonarQube).
# El token NO va aqui: se pasa con -Dsonar.token=$SONAR_TOKEN

sonar.projectKey=Proyecto-DAST
sonar.projectName=secure-crm-dastsast
sonar.projectVersion=fase2
sonar.host.url=http://localhost:9000

sonar.sources=apps/web,apps/api/src
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,**/coverage/**,**/reports-dc/**,**/*.test.*,**/*.spec.*,semgrep.sarif

# Semgrep importado como SARIF
sonar.sarifReportPaths=semgrep.sarif

# Cobertura generada con: pnpm test:coverage (sin exclusiones: se mide todo el codigo)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# OWASP Dependency-Check (plugin de SonarQube)
sonar.dependencyCheck.jsonReportPath=reports-dc/dependency-check-report.json
sonar.dependencyCheck.htmlReportPath=reports-dc/dependency-check-report.html
